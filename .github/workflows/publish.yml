name: Pubblica reel

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = pubblica i post in scadenza · dry-run = mostra soltanto · check = verifica i token"
        type: choice
        options: [publish, dry-run, check]
        default: publish

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pubblica i post in scadenza
        run: node scripts/publish.mjs "$MODE"
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          IG_TOKEN_IT: ${{ secrets.IG_TOKEN_IT }}
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
          PAGES_BASE: https://fr3nezy.github.io/starloupe-media

      # anche se un post fallisce, salva tentativi ed errori così il giro dopo non riparte da zero
      - name: Salva lo stato della coda
        if: always()
        run: |
          git config user.name "starloupe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue published
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna la coda di pubblicazione"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
